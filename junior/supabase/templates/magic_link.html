<div style="font-family: Arial, sans-serif; color: #171B28; max-width: 480px;">
  <p style="font-size: 18px; margin: 0 0 16px;">Sign in to Junior</p>
  <p style="margin: 0 0 16px;">Use this link to sign in. It expires in one hour.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; padding: 10px 16px; border: 1px solid #171B28; color: #171B28; text-decoration: none;">
      Sign in to Junior
    </a>
  </p>
  <p style="margin: 0 0 8px;">Or enter this code on the sign-in page:</p>
  <p style="font-family: monospace; font-size: 22px; letter-spacing: 4px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 12px; color: #46648F; margin: 0;">If you did not ask for this, you can ignore this email.</p>
</div>
